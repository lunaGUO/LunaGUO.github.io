[[items]]
number = "P1"
title = "Target-Controlled Feedforward Management Technology for Green Buildings"
subtitle = "Funded by the \"13th Five-Year Plan\" Key Research Program, China; research assistant at Tongji University"
date = "2019 - 2021"
content = "Developed an automatic tool to convert BIM (Revit) to BEM (EnergyPlus) through an intermediate gbXML file. Enabled automatic gbXML checking and IDF enrichment to ensure successful BIM-to-BEM conversion."
image = "/projects/p1-bim2bem-workflow.jpg"
details = "The workflow automates BIM-to-BEM conversion in three stages. First, a **BIM checker** validates the Revit model against a standard layer definition and exports a checked gbXML file. Second, a **gbXML editor** refines the geometry, and a **data converter** translates the edited gbXML into an initial IDF. Third, an **IDF checker** enriches that IDF with weather data, internal loads, and other information not captured in the BIM model, producing a simulation-ready file for EnergyPlus.\n\nCode: [BIM2BEM on GitHub](https://github.com/lunaGUO/BIM2BEM/tree/main)"
papers = ["C1"]
